<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعي التجريبي</title>

<style>
body{
    margin:0;
    font-family:Tahoma, sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}
header{
    padding:60px 20px;
}
h1{
    font-size:40px;
    margin-bottom:10px;
}
p{
    font-size:18px;
    opacity:0.9;
}
button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#00c6ff;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}
button:hover{
    background:#0072ff;
}
section{
    padding:50px 20px;
    background:white;
    color:#333;
}
.card{
    max-width:300px;
    margin:20px auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
footer{
    padding:20px;
    background:#111;
}
</style>
</head>

<body>

<header>
    <h1>مرحباً بك 👋</h1>
    <p>هذا موقع تجريبي منشور على GitHub Pages</p>
    <button onclick="showMessage()">اضغطني</button>
</header>

<section>
    <div class="card">
        <h2>عن الموقع</h2>
        <p>هذا قالب افتراضي بسيط يمكنك تطويره وتحويله إلى مشروع حقيقي.</p>
    </div>
</section>

<footer>
    جميع الحقوق محفوظة © 2026
</footer>

<script>
function showMessage(){
    alert("أنت شغال صح 👍 كمل يا بطل!");
}
</script>

</body>
</html>
